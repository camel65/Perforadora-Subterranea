<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Deep-Core Drill - Simulador de Perforadora Subterránea</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Pantalla de inicio centrada */
        #pantalla-inicio {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 40;
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.08), #000000 72%);
        }

        #btn-inicio {
            padding: 18px 48px;
            font-size: clamp(1.25rem, 4.5vw, 1.85rem);
            font-weight: bold;
            color: #ffffff;
            background: radial-gradient(circle at top, rgba(0, 240, 255, 0.22), rgba(10, 5, 25, 0.92));
            border: 2px solid #00f0ff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 28px rgba(0, 240, 255, 0.45), inset 0 0 14px rgba(255, 0, 127, 0.25);
            letter-spacing: 3px;
        }

        #btn-inicio:hover,
        #btn-inicio:active {
            background-color: #00f0ff;
            color: #000000;
            box-shadow: 0 0 42px rgba(0, 240, 255, 0.95);
            transform: scale(1.04);
        }

        /* Controles Flotantes Superiores */
        .controles-sup {
            display: none;
            position: fixed;
            top: calc(10px + env(safe-area-inset-top));
            right: calc(10px + env(safe-area-inset-right));
            left: calc(10px + env(safe-area-inset-left));
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 50;
            pointer-events: none;
        }

        .btn-sup {
            pointer-events: auto;
            padding: 8px 13px;
            font-size: clamp(0.75rem, 2.8vw, 0.92rem);
            font-weight: 600;
            color: #ffffff;
            background: rgba(5, 10, 22, 0.88);
            border: 1px solid rgba(0, 240, 255, 0.55);
            border-radius: 999px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .btn-sup:hover,
        .btn-sup:active {
            background: #00f0ff;
            color: #000000;
        }

        #btn-salir {
            border-color: rgba(255, 0, 85, 0.7);
        }

        #btn-salir:hover,
        #btn-salir:active {
            background: #ff0055;
            border-color: #ff0055;
            color: #ffffff;
        }

        /* Botones CRIO-FRÍO, RETENER y PERFORAR abajo a la derecha junto a los relojes */
        .controles-broca {
            display: none;
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom));
            right: calc(10px + env(safe-area-inset-right));
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            z-index: 35;
            pointer-events: none;
        }

        .btn-mando {
            pointer-events: auto;
            width: clamp(54px, 14.5vw, 84px);
            height: clamp(74px, 16vh, 104px);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.85);
            font-size: clamp(0.62rem, 2.1vw, 0.85rem);
            font-weight: 800;
            letter-spacing: 0.2px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            transition: transform 0.08s ease, box-shadow 0.12s ease, filter 0.12s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.85);
            text-align: center;
            padding: 2px;
        }

        .btn-mando small {
            font-size: clamp(0.5rem, 1.6vw, 0.64rem);
            font-weight: 600;
            opacity: 0.85;
        }

        #btn-refrigerar {
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.92), rgba(0, 95, 145, 0.96));
            border-color: #00f0ff;
            color: #000000;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.45);
        }

        #btn-refrigerar:active,
        #btn-refrigerar.activo {
            transform: scale(0.94) translateY(2px);
            filter: brightness(1.2);
            box-shadow: 0 0 28px rgba(0, 240, 255, 0.95);
        }

        #btn-frenar {
            background: linear-gradient(180deg, rgba(255, 0, 85, 0.9), rgba(130, 0, 40, 0.96));
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 0, 85, 0.45);
        }

        #btn-frenar:active,
        #btn-frenar.activo {
            transform: scale(0.94) translateY(2px);
            filter: brightness(1.2);
            box-shadow: 0 0 28px rgba(255, 0, 85, 0.95);
        }

        #btn-perforar {
            background: linear-gradient(180deg, rgba(57, 255, 20, 0.92), rgba(18, 120, 0, 0.96));
            border-color: #39ff14;
            color: #000000;
            box-shadow: 0 0 16px rgba(57, 255, 20, 0.45);
        }

        #btn-perforar:active,
        #btn-perforar.activo {
            transform: scale(0.94) translateY(2px);
            filter: brightness(1.2);
            box-shadow: 0 0 28px rgba(57, 255, 20, 0.95);
        }

        @media (min-width: 768px) {
            .controles-broca {
                bottom: 22px;
                right: 24px;
                gap: 10px;
            }
        }

        #canvas-container {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <audio id="miMusica" src="musica51.mp3" preload="auto" loop></audio>

    <div id="pantalla-inicio">
        <button id="btn-inicio">INICIO</button>
    </div>

    <div class="controles-sup" id="panel-sup">
        <button class="btn-sup" id="btn-laser">🔦 Láseres: ON</button>
        <button class="btn-sup" id="btn-audio">🔊 Audio: ON</button>
        <button class="btn-sup" id="btn-salir">✖ Salir</button>
    </div>

    <div class="controles-broca" id="controles-broca">
        <button class="btn-mando" id="btn-refrigerar">
            <span>❄ CRIO-FRÍO</span>
            <small>[C / Esp]</small>
        </button>
        <button class="btn-mando" id="btn-frenar">
            <span>🛑 RETENER</span>
            <small>[S / ↓]</small>
        </button>
        <button class="btn-mando" id="btn-perforar">
            <span>⚡ PERFORAR</span>
            <small>[W / ↑]</small>
        </button>
    </div>

    <div id="canvas-container">
        <canvas id="drillCanvas"></canvas>
    </div>

    <script>
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const btnInicio = document.getElementById('btn-inicio');
        const panelSup = document.getElementById('panel-sup');
        const controlesBroca = document.getElementById('controles-broca');
        const btnPerforar = document.getElementById('btn-perforar');
        const btnFrenar = document.getElementById('btn-frenar');
        const btnRefrigerar = document.getElementById('btn-refrigerar');
        const btnLaser = document.getElementById('btn-laser');
        const btnAudio = document.getElementById('btn-audio');
        const btnSalir = document.getElementById('btn-salir');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('drillCanvas');
        const ctx = canvas.getContext('2d');
        const audioElement = document.getElementById('miMusica');

        let animacionId = null;
        let activo = false;

        // Estados de la expedición: 'DESCENSO_POZO', 'PERFORANDO', 'NUCLEO_ALCANZADO'
        let faseJuego = 'DESCENSO_POZO';
        let tiempoFase = 0;
        let ultimoFrameTime = 0;

        // Misión contrarreloj de 60 segundos hasta la veta madre
        const DURACION_MISION = 60.0;
        let tiempoRestante = DURACION_MISION;

        // Parámetros físicos de la perforadora
        let velocidadAvance = 0;      // m/s (0 a 35)
        let rpmBroca = 120;           // RPM cabezal de corte (0 a 1200)
        let temperaturaBroca = 280;   // °C (100°C a 1150°C - peligro > 850°C)
        let presionHidraulica = 140;  // BAR (50 a 450 BAR)
        let profundidad = 420;        // Metros bajo superficie
        let mineralesExtraidos = 0;   // Unidades cuánticas recolectadas
        let sobrecalentado = false;

        let laseresActivos = true;
        let rumboLateral = 0;         // Dirección de perforación (-0.85 a 0.85)
        let anguloCabezal = 0;        // Rotación visual de la broca frontal

        // Controles presionados
        let perforando = false;
        let frenando = false;
        let refrigerando = false;
        let girandoIzq = false;
        let girandoDer = false;

        // Control táctil de dirección en el canvas
        let toqueActivo = false;
        let toqueInicioX = 0;
        let rumboInicialToque = 0;

        // Trazado procedural y partículas
        let semillaMina = {};
        let cristalesMina = [];
        let particulas = [];

        function ajustarCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function getAnchoLogico() {
            return window.innerWidth;
        }

        function getAltoLogico() {
            return window.innerHeight;
        }

        window.addEventListener('resize', () => {
            if (activo) ajustarCanvas();
        });

        window.addEventListener('orientationchange', () => {
            if (activo) setTimeout(ajustarCanvas, 150);
        });

        // Controles de Teclado
        window.addEventListener('keydown', (e) => {
            if (!activo) return;
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { perforando = true; btnPerforar.classList.add('activo'); }
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { frenando = true; btnFrenar.classList.add('activo'); }
            if (e.key === 'c' || e.key === 'C' || e.key === ' ') { refrigerando = true; btnRefrigerar.classList.add('activo'); }
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') girandoIzq = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') girandoDer = true;
        });

        window.addEventListener('keyup', (e) => {
            if (!activo) return;
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { perforando = false; btnPerforar.classList.remove('activo'); }
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { frenando = false; btnFrenar.classList.remove('activo'); }
            if (e.key === 'c' || e.key === 'C' || e.key === ' ') { refrigerando = false; btnRefrigerar.classList.remove('activo'); }
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') girandoIzq = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') girandoDer = false;
        });

        // Deslizar el dedo sobre el túnel para orientar el rumbo lateral
        canvas.addEventListener('touchstart', (e) => {
            if (!activo || faseJuego !== 'PERFORANDO' || e.touches.length === 0) return;
            const yToque = e.touches[0].clientY;
            if (yToque < getAltoLogico() - 150) {
                toqueActivo = true;
                toqueInicioX = e.touches[0].clientX;
                rumboInicialToque = rumboLateral;
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (!toqueActivo || e.touches.length === 0) return;
            const deltaX = (e.touches[0].clientX - toqueInicioX) / (getAnchoLogico() * 0.35);
            rumboLateral = Math.max(-0.85, Math.min(0.85, rumboInicialToque + deltaX));
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            toqueActivo = false;
        });

        // Eventos táctiles y ratón para mandos
        const bindMando = (btn, setFlag) => {
            const on = (e) => { e.preventDefault(); e.stopPropagation(); setFlag(true); btn.classList.add('activo'); };
            const off = (e) => { e.preventDefault(); e.stopPropagation(); setFlag(false); btn.classList.remove('activo'); };
            btn.addEventListener('mousedown', on);
            btn.addEventListener('mouseup', off);
            btn.addEventListener('mouseleave', off);
            btn.addEventListener('touchstart', on, { passive: false });
            btn.addEventListener('touchend', off, { passive: false });
            btn.addEventListener('touchcancel', off, { passive: false });
        };

        bindMando(btnPerforar, (v) => perforando = v);
        bindMando(btnFrenar, (v) => frenando = v);
        bindMando(btnRefrigerar, (v) => refrigerando = v);

        btnLaser.addEventListener('click', (e) => {
            e.stopPropagation();
            laseresActivos = !laseresActivos;
            btnLaser.textContent = laseresActivos ? "🔦 Láseres: ON" : "💡 Láseres: ECO";
        });

        btnAudio.addEventListener('click', (e) => {
            e.stopPropagation();
            audioElement.muted = !audioElement.muted;
            btnAudio.textContent = audioElement.muted ? "🔇 Audio: OFF" : "🔊 Audio: ON";
        });

        btnInicio.addEventListener('click', () => {
            pantallaInicio.style.display = 'none';
            panelSup.style.display = 'flex';
            canvasContainer.style.display = 'block';

            ajustarCanvas();
            generarNuevaExcavacion();
            activo = true;
            ultimoFrameTime = performance.now();

            audioElement.currentTime = 0;
            audioElement.muted = false;
            btnAudio.textContent = "🔊 Audio: ON";
            audioElement.play().catch(() => {});

            iniciarBucle(ultimoFrameTime);
        });

        btnSalir.addEventListener('click', (e) => {
            e.stopPropagation();
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);
            audioElement.pause();

            canvasContainer.style.display = 'none';
            panelSup.style.display = 'none';
            controlesBroca.style.display = 'none';
            pantallaInicio.style.display = 'flex';
            ctx.clearRect(0, 0, getAnchoLogico(), getAltoLogico());
        });

        function generarNuevaExcavacion() {
            faseJuego = 'DESCENSO_POZO';
            tiempoFase = 0;
            tiempoRestante = DURACION_MISION;

            velocidadAvance = 0;
            rpmBroca = 150;
            temperaturaBroca = 260;
            presionHidraulica = 120;
            profundidad = 400 + Math.floor(Math.random() * 200);
            mineralesExtraidos = 0;
            sobrecalentado = false;
            rumboLateral = 0;
            particulas = [];

            semillaMina = {
                freqX1: 0.002 + Math.random() * 0.002,
                freqX2: 0.0045 + Math.random() * 0.003,
                ampX: 0.8 + Math.random() * 0.6,
                faseX: Math.random() * Math.PI * 2,
                freqY1: 0.0022 + Math.random() * 0.002,
                ampY: 0.7 + Math.random() * 0.5,
                faseY: Math.random() * Math.PI * 2,
                freqDureza: 0.006 + Math.random() * 0.005,
                faseDureza: Math.random() * Math.PI * 2
            };

            const coloresCristal = ['#00f0ff', '#39ff14', '#ff007f', '#ffaa00', '#b026ff'];
            cristalesMina = [];
            for (let d = 420; d < 3500; d += 16 + Math.random() * 24) {
                cristalesMina.push({
                    prof: d,
                    angulo: Math.random() * Math.PI * 2,
                    tamano: 0.65 + Math.random() * 1.15,
                    color: coloresCristal[Math.floor(Math.random() * coloresCristal.length)],
                    recolectado: false
                });
            }
        }

        function obtenerDesvioX(p) {
            return (Math.sin(p * semillaMina.freqX1 + semillaMina.faseX) * 0.65 +
                    Math.cos(p * semillaMina.freqX2) * 0.35) * semillaMina.ampX;
        }

        function obtenerDesvioY(p) {
            return Math.sin(p * semillaMina.freqY1 + semillaMina.faseY) * semillaMina.ampY;
        }

        function obtenerDurezaRoca(p) {
            return 0.55 + Math.sin(p * semillaMina.freqDureza + semillaMina.faseDureza) * 0.45;
        }

        function emitirChispasRoca(cx, cy, cantidad, colorBase) {
            for (let i = 0; i < cantidad; i++) {
                const ang = Math.random() * Math.PI * 2;
                const vel = 120 + Math.random() * 400;
                particulas.push({
                    x: cx + (Math.random() - 0.5) * 80,
                    y: cy + (Math.random() - 0.5) * 80,
                    vx: Math.cos(ang) * vel,
                    vy: Math.sin(ang) * vel,
                    vida: 0.45 + Math.random() * 0.5,
                    maxVida: 1.0,
                    color: colorBase,
                    tam: 2 + Math.random() * 3.5
                });
            }
        }

        function dibujarIndicadorCircular(ctx, cx, cy, radio, valor, minVal, maxVal, titulo, unidad, colorNormal, umbralAlerta) {
            ctx.save();
            const gradFondo = ctx.createRadialGradient(cx, cy - radio * 0.2, radio * 0.1, cx, cy, radio);
            gradFondo.addColorStop(0, '#0d172a');
            gradFondo.addColorStop(1, '#04070e');

            ctx.fillStyle = gradFondo;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = Math.max(2, radio * 0.055);
            ctx.beginPath();
            ctx.arc(cx, cy, radio, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            const angInicio = Math.PI * 0.75;
            const angFin = Math.PI * 2.25;
            const rango = angFin - angInicio;

            ctx.lineWidth = Math.max(3, radio * 0.095);
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.beginPath();
            ctx.arc(cx, cy, radio * 0.84, angInicio, angFin);
            ctx.stroke();

            const frac = Math.min(1, Math.max(0, (valor - minVal) / (maxVal - minVal)));
            const enAlerta = umbralAlerta !== null && valor >= umbralAlerta;
            const colorActivo = enAlerta ? '#ff0055' : colorNormal;

            ctx.strokeStyle = colorActivo;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colorActivo;
            ctx.beginPath();
            ctx.arc(cx, cy, radio * 0.84, angInicio, angInicio + frac * rango);
            ctx.stroke();

            // Aguja
            const angAguja = angInicio + frac * rango;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1.5, radio * 0.04);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angAguja) * (radio * 0.76), cy + Math.sin(angAguja) * (radio * 0.76));
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = colorActivo;
            ctx.font = `bold ${Math.max(9, Math.round(radio * 0.24))}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillText(Math.round(valor), cx, cy + radio * 0.42);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = `bold ${Math.max(6.5, Math.round(radio * 0.14))}px sans-serif`;
            ctx.fillText(`${titulo} ${unidad}`, cx, cy + radio * 0.72);
            ctx.restore();
        }

        function dibujarCristal3D(ctx, x, y, escala, angulo, color) {
            const h = 38 * escala;
            const w = 14 * escala;
            if (h < 3) return;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angulo + Math.PI / 2);

            ctx.fillStyle = color;
            ctx.shadowBlur = Math.min(22, 16 * escala);
            ctx.shadowColor = color;

            ctx.beginPath();
            ctx.moveTo(0, -h);
            ctx.lineTo(w, -h * 0.25);
            ctx.lineTo(w * 0.6, 0);
            ctx.lineTo(-w * 0.6, 0);
            ctx.lineTo(-w, -h * 0.25);
            ctx.closePath();
            ctx.fill();

            ctx.rotate(0.45);
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.7);
            ctx.lineTo(w * 0.7, -h * 0.2);
            ctx.lineTo(0, 0);
            ctx.lineTo(-w * 0.7, -h * 0.2);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function iniciarBucle(timestamp) {
            if (!activo) return;

            const dt = Math.min(0.05, (timestamp - ultimoFrameTime) / 1000);
            ultimoFrameTime = timestamp;
            tiempoFase += dt;

            const w = getAnchoLogico();
            const h = getAltoLogico();
            const esMovil = w < 640;

            // =========================================================================
            // FASE 1: INMERSIÓN EN EL POZO CUÁNTICO (3 SEGUNDOS)
            // =========================================================================
            if (faseJuego === 'DESCENSO_POZO') {
                controlesBroca.style.display = 'none';
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, w, h);

                const prog = Math.min(1, tiempoFase / 3.0);
                const cx = w / 2;
                const cy = h / 2;

                for (let k = 8; k >= 1; k--) {
                    const radio = (k * Math.min(w, h) * 0.085) * (0.4 + Math.pow(prog, 1.8) * 1.9);
                    ctx.strokeStyle = k % 2 === 0 ? 'rgba(0, 240, 255, 0.38)' : 'rgba(255, 0, 127, 0.28)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radio, 0, Math.PI * 2);
                    ctx.stroke();
                }

                const rBoca = 75 + Math.pow(prog, 2.3) * 280;
                ctx.fillStyle = '#050811';
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 22;
                ctx.shadowColor = '#00f0ff';
                ctx.beginPath();
                ctx.arc(cx, cy, rBoca, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#00f0ff';
                ctx.font = `bold ${esMovil ? 15 : 22}px sans-serif`;
                ctx.textAlign = 'center';
                const segs = Math.ceil(3 - tiempoFase);
                ctx.fillText(`ACOPLANDO CABINA EN ${segs}...`, cx, h - (esMovil ? 55 : 65));

                if (tiempoFase >= 3.0) {
                    faseJuego = 'PERFORANDO';
                    tiempoFase = 0;
                    velocidadAvance = 14;
                    controlesBroca.style.display = 'flex';
                }

                animacionId = requestAnimationFrame(iniciarBucle);
                return;
            }

            // =========================================================================
            // FASE 2: PERFORACIÓN ACTIVA (60 SEGUNDOS)
            // =========================================================================
            const durezaActual = obtenerDurezaRoca(profundidad);

            if (faseJuego === 'PERFORANDO') {
                tiempoRestante -= dt;
                if (tiempoRestante <= 0) {
                    tiempoRestante = 0;
                    faseJuego = 'NUCLEO_ALCANZADO';
                    tiempoFase = 0;
                    controlesBroca.style.display = 'none';
                }

                if (temperaturaBroca >= 1050) {
                    sobrecalentado = true;
                } else if (temperaturaBroca <= 520) {
                    sobrecalentado = false;
                }

                if (perforando && !sobrecalentado) {
                    rpmBroca += (1150 - rpmBroca) * 3.5 * dt;
                    const empujeEfectivo = (28 - durezaActual * 14);
                    velocidadAvance += (empujeEfectivo - velocidadAvance) * 2.5 * dt;
                    temperaturaBroca += (85 + durezaActual * 135) * dt;
                    presionHidraulica += ((260 + durezaActual * 170) - presionHidraulica) * 4 * dt;
                } else if (frenando) {
                    rpmBroca += (120 - rpmBroca) * 4 * dt;
                    velocidadAvance = Math.max(0, velocidadAvance - 22 * dt);
                    temperaturaBroca = Math.max(120, temperaturaBroca - 65 * dt);
                    presionHidraulica += (90 - presionHidraulica) * 4 * dt;
                } else {
                    const velRalenti = sobrecalentado ? 2 : 11;
                    rpmBroca += ((sobrecalentado ? 80 : 480) - rpmBroca) * 2.5 * dt;
                    velocidadAvance += (velRalenti - velocidadAvance) * 2 * dt;
                    temperaturaBroca = Math.max(150, temperaturaBroca - 35 * dt);
                    presionHidraulica += (150 - presionHidraulica) * 3 * dt;
                }

                if (refrigerando) {
                    temperaturaBroca = Math.max(100, temperaturaBroca - 260 * dt);
                }

                temperaturaBroca = Math.min(1150, temperaturaBroca);
                profundidad += velocidadAvance * dt * 1.4;
                anguloCabezal += (rpmBroca / 60) * Math.PI * 2 * dt;

                if (girandoIzq) rumboLateral -= 0.9 * dt;
                if (girandoDer) rumboLateral += 0.9 * dt;
                rumboLateral = Math.max(-0.85, Math.min(0.85, rumboLateral));

                if (velocidadAvance > 4 && Math.random() < 0.45 + durezaActual * 0.45) {
                    const colorChispa = temperaturaBroca > 800 ? '#ff3366' : (durezaActual > 0.7 ? '#ffaa00' : '#00f0ff');
                    emitirChispasRoca(w / 2, h * 0.42, perforando ? 4 : 2, colorChispa);
                }
            } else if (faseJuego === 'NUCLEO_ALCANZADO') {
                velocidadAvance = Math.max(0, velocidadAvance - 15 * dt);
                rpmBroca = Math.max(0, rpmBroca - 350 * dt);
                anguloCabezal += (rpmBroca / 60) * Math.PI * 2 * dt;

                if (tiempoFase >= 3.0) {
                    generarNuevaExcavacion();
                    animacionId = requestAnimationFrame(iniciarBucle);
                    return;
                }
            }

            // =========================================================================
            // RENDERIZADO 3D DEL CONDUCTO SUBTERRÁNEO Y CRISTALES CUÁNTICOS
            // =========================================================================
            ctx.fillStyle = '#020306';
            ctx.fillRect(0, 0, w, h);

            const numAnillos = 42;
            const pasoProf = 4.5;
            const profBase = Math.floor(profundidad / pasoProf) * pasoProf;
            const subOffset = (profundidad - profBase) / pasoProf;

            const camX = obtenerDesvioX(profundidad);
            const camY = obtenerDesvioY(profundidad);
            const centroTunelY = h * (esMovil ? 0.36 : 0.44);

            let anillos = [];
            for (let i = numAnillos; i >= 1; i--) {
                const zIdx = i - subOffset;
                const profSeg = profBase + i * pasoProf;
                const escala = 1 / (1 + zIdx * 0.17);

                const dx = (obtenerDesvioX(profSeg) - camX) * Math.pow(zIdx, 1.5) * 11 - (rumboLateral * (esMovil ? 130 : 240) * escala);
                const dy = (obtenerDesvioY(profSeg) - camY) * Math.pow(zIdx, 1.45) * 9;

                const cx = w / 2 + dx;
                const cy = centroTunelY + dy;
                const radioTunel = Math.max(w, h) * (esMovil ? 0.85 : 0.72) * escala;
                const durezaSeg = obtenerDurezaRoca(profSeg);

                const alcanceLaser = laseresActivos ? 34 : 18;
                const luzFoco = Math.max(0, 1 - zIdx / alcanceLaser);

                anillos.push({
                    i, zIdx, profSeg, escala, cx, cy, radioTunel, durezaSeg, luzFoco
                });
            }

            const ladosPoligono = 14;
            for (let a = 0; a < anillos.length - 1; a++) {
                const lej = anillos[a];
                const cer = anillos[a + 1];

                const luz = 0.1 + cer.luzFoco * 0.88;
                const rCol = Math.floor((28 + cer.durezaSeg * 46) * luz);
                const gCol = Math.floor((20 + (1 - cer.durezaSeg) * 38) * luz);
                const bCol = Math.floor((48 + cer.durezaSeg * 62) * luz);

                for (let l = 0; l < ladosPoligono; l++) {
                    const ang1 = (l / ladosPoligono) * Math.PI * 2;
                    const ang2 = ((l + 1) / ladosPoligono) * Math.PI * 2;

                    const rug1Lej = 0.92 + Math.sin(lej.profSeg * 0.2 + l * 1.7) * 0.08;
                    const rug2Lej = 0.92 + Math.sin(lej.profSeg * 0.2 + (l + 1) * 1.7) * 0.08;
                    const rug1Cer = 0.92 + Math.sin(cer.profSeg * 0.2 + l * 1.7) * 0.08;
                    const rug2Cer = 0.92 + Math.sin(cer.profSeg * 0.2 + (l + 1) * 1.7) * 0.08;

                    const x1L = lej.cx + Math.cos(ang1) * lej.radioTunel * rug1Lej;
                    const y1L = lej.cy + Math.sin(ang1) * lej.radioTunel * rug1Lej;
                    const x2L = lej.cx + Math.cos(ang2) * lej.radioTunel * rug2Lej;
                    const y2L = lej.cy + Math.sin(ang2) * lej.radioTunel * rug2Lej;

                    const x1C = cer.cx + Math.cos(ang1) * cer.radioTunel * rug1Cer;
                    const y1C = cer.cy + Math.sin(ang1) * cer.radioTunel * rug1Cer;
                    const x2C = cer.cx + Math.cos(ang2) * cer.radioTunel * rug2Cer;
                    const y2C = cer.cy + Math.sin(ang2) * cer.radioTunel * rug2Cer;

                    const sombraFaceta = 0.78 + Math.sin(l * 2.1 + lej.profSeg * 0.1) * 0.22;
                    ctx.fillStyle = `rgb(${Math.floor(rCol * sombraFaceta)}, ${Math.floor(gCol * sombraFaceta)}, ${Math.floor(bCol * sombraFaceta)})`;
                    ctx.beginPath();
                    ctx.moveTo(x1L, y1L);
                    ctx.lineTo(x2L, y2L);
                    ctx.lineTo(x2C, y2C);
                    ctx.lineTo(x1C, y1C);
                    ctx.closePath();
                    ctx.fill();

                    if (cer.durezaSeg > 0.72 && l % 3 === 0) {
                        ctx.strokeStyle = `rgba(0, 240, 255, ${cer.luzFoco * 0.42})`;
                        ctx.lineWidth = Math.max(1, 2 * cer.escala);
                        ctx.beginPath();
                        ctx.moveTo(x1L, y1L);
                        ctx.lineTo(x1C, y1C);
                        ctx.stroke();
                    }
                }

                for (let cristal of cristalesMina) {
                    if (!cristal.recolectado && Math.abs(cristal.prof - cer.profSeg) < pasoProf * 0.5) {
                        const cxCris = cer.cx + Math.cos(cristal.angulo) * (cer.radioTunel * 0.9);
                        const cyCris = cer.cy + Math.sin(cristal.angulo) * (cer.radioTunel * 0.9);
                        dibujarCristal3D(ctx, cxCris, cyCris, cer.escala * cristal.tamano * (esMovil ? 1.25 : 1.5), cristal.angulo, cristal.color);

                        if (cer.zIdx < 2.3) {
                            cristal.recolectado = true;
                            mineralesExtraidos += Math.floor(15 + cristal.tamano * 20);
                            emitirChispasRoca(cxCris, cyCris, 12, cristal.color);
                        }
                    }
                }
            }

            // =========================================================================
            // CABEZAL DE CORTE ROTATORIO Y HACES LÁSER DE EXCAVACIÓN
            // =========================================================================
            const fondoTunel = anillos[0];
            const cabezalX = fondoTunel.cx;
            const cabezalY = fondoTunel.cy;

            if (laseresActivos) {
                ctx.save();
                const origenesLaser = [
                    { x: w * 0.12, y: h * 0.22, color: 'rgba(0, 240, 255, 0.26)' },
                    { x: w * 0.88, y: h * 0.22, color: 'rgba(0, 240, 255, 0.26)' },
                    { x: w * 0.18, y: h * 0.58, color: 'rgba(255, 0, 127, 0.24)' },
                    { x: w * 0.82, y: h * 0.58, color: 'rgba(255, 0, 127, 0.24)' }
                ];

                for (let lsr of origenesLaser) {
                    const gradL = ctx.createLinearGradient(lsr.x, lsr.y, cabezalX, cabezalY);
                    gradL.addColorStop(0, lsr.color);
                    gradL.addColorStop(1, 'rgba(0, 240, 255, 0.03)');

                    ctx.strokeStyle = gradL;
                    ctx.lineWidth = perforando ? (esMovil ? 9 : 14) : (esMovil ? 5 : 7);
                    ctx.beginPath();
                    ctx.moveTo(lsr.x, lsr.y);
                    ctx.lineTo(cabezalX + Math.cos(anguloCabezal) * 22, cabezalY + Math.sin(anguloCabezal) * 22);
                    ctx.stroke();
                }
                ctx.restore();
            }

            ctx.save();
            ctx.translate(cabezalX, cabezalY);
            ctx.rotate(anguloCabezal);

            const rBroca = esMovil ? 34 : 46;
            const colorIncandescencia = temperaturaBroca > 850 ? '#ff0055' : (temperaturaBroca > 600 ? '#ffaa00' : '#00f0ff');

            ctx.strokeStyle = colorIncandescencia;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 18;
            ctx.shadowColor = colorIncandescencia;

            ctx.beginPath();
            ctx.arc(0, 0, rBroca * 0.45, 0, Math.PI * 2);
            ctx.stroke();

            for (let b = 0; b < 6; b++) {
                const angB = (b / 6) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angB) * rBroca, Math.sin(angB) * rBroca);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(Math.cos(angB) * (rBroca * 0.72), Math.sin(angB) * (rBroca * 0.72), esMovil ? 2.8 : 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            ctx.save();
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vida -= dt * 1.4;

                if (p.vida <= 0) {
                    particulas.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = Math.max(0, p.vida);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.tam, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // =========================================================================
            // CONSOLA INFERIOR: CAJA IZQ + RELOJES CENTRO + BOTONES DER
            // =========================================================================
            ctx.save();

            const intensidadVib = (rpmBroca / 1200) * (0.8 + durezaActual * 2.4);
            const vibX = velocidadAvance > 0.5 ? (Math.random() - 0.5) * intensidadVib * 1.8 : 0;
            const vibY = velocidadAvance > 0.5 ? (Math.random() - 0.5) * intensidadVib * 1.8 : 0;
            ctx.translate(vibX, vibY);

            const altoConsola = esMovil ? 116 : 148;
            const topConsola = h - altoConsola;

            const gradConsola = ctx.createLinearGradient(0, topConsola, 0, h);
            gradConsola.addColorStop(0, 'rgba(16, 24, 39, 0.96)');
            gradConsola.addColorStop(1, 'rgba(4, 7, 14, 0.99)');
            ctx.fillStyle = gradConsola;
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(0, topConsola + 12);
            ctx.lineTo(w * 0.08, topConsola);
            ctx.lineTo(w * 0.92, topConsola);
            ctx.lineTo(w, topConsola + 12);
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Caja de telemetría ABAJO A LA IZQUIERDA (al lado de los relojes)
            const hudX = esMovil ? 8 : 18;
            const hudW = esMovil ? Math.min(136, w * 0.34) : 230;
            const hudH = altoConsola - 18;
            const hudY = topConsola + 9;

            ctx.fillStyle = 'rgba(5, 10, 20, 0.88)';
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(hudX, hudY, hudW, hudH, 8);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'left';
            const padX = hudX + (esMovil ? 7 : 12);
            const lineStep = hudH / 4.3;
            const baseY = hudY + lineStep * 0.85;

            ctx.font = `bold ${esMovil ? 9 : 12}px sans-serif`;
            ctx.fillStyle = '#00f0ff';
            ctx.fillText(`TIEMPO: ${tiempoRestante.toFixed(1)}s`, padX, baseY);

            ctx.font = `${esMovil ? 8.5 : 11.5}px sans-serif`;
            ctx.fillStyle = '#39ff14';
            ctx.fillText(`PROF: -${Math.floor(profundidad)}m`, padX, baseY + lineStep);

            ctx.fillStyle = '#ff007f';
            ctx.fillText(`CRIST: ${mineralesExtraidos}`, padX, baseY + lineStep * 2);

            const nivelDurezaTxt = durezaActual > 0.75 ? 'GRANITO' : (durezaActual > 0.45 ? 'BASALTO' : 'SEDIMENTO');
            ctx.fillStyle = '#ffaa00';
            ctx.fillText(`ESTR: ${nivelDurezaTxt}`, padX, baseY + lineStep * 3);

            // Ancho reservado a la derecha para los 3 botones (CRIO-FRÍO, RETENER, PERFORAR)
            const anchoBotonesDer = esMovil ? Math.min(182, w * 0.46) : 275;
            const zonaIzqFin = hudX + hudW + 6;
            const zonaDerInicio = w - anchoBotonesDer - 10;
            const anchoCentro = Math.max(90, zonaDerInicio - zonaIzqFin);
            const centroRelojesX = zonaIzqFin + anchoCentro / 2;
            const centroRelojesY = topConsola + altoConsola * 0.54;

            const radioReloj = Math.max(
                18,
                Math.min(esMovil ? 28 : 50, anchoCentro / 6.4, (altoConsola - 22) * 0.44)
            );
            const separacionReloj = Math.min(esMovil ? 44 : 112, anchoCentro * 0.33);

            dibujarIndicadorCircular(ctx, centroRelojesX - separacionReloj, centroRelojesY, radioReloj, temperaturaBroca, 100, 1150, 'TEMP', '°C', '#ffaa00', 850);
            dibujarIndicadorCircular(ctx, centroRelojesX, centroRelojesY, radioReloj, presionHidraulica, 50, 450, 'PRES', 'BAR', '#00f0ff', 380);
            dibujarIndicadorCircular(ctx, centroRelojesX + separacionReloj, centroRelojesY, radioReloj, velocidadAvance, 0, 35, 'AVAN', 'M/S', '#39ff14', null);

            // Alerta visual de sobrecalentamiento
            if (sobrecalentado) {
                ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
                ctx.fillRect(0, 0, w, h);

                ctx.textAlign = 'center';
                ctx.font = `bold ${esMovil ? 13 : 22}px sans-serif`;
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#ff0055';
                ctx.fillText('⚠ NÚCLEO SOBRECALENTADO - USA CRIO-FRÍO ⚠', w / 2, topConsola - 24);
                ctx.shadowBlur = 0;
            }

            // =========================================================================
            // PANTALLA DE VETA MADRE ALCANZADA (60 SEGUNDOS)
            // =========================================================================
            if (faseJuego === 'NUCLEO_ALCANZADO') {
                ctx.fillStyle = 'rgba(0, 5, 15, 0.84)';
                ctx.fillRect(0, 0, w, h);

                ctx.textAlign = 'center';
                ctx.font = `bold ${esMovil ? 22 : 40}px sans-serif`;
                ctx.fillStyle = '#39ff14';
                ctx.shadowBlur = 22;
                ctx.shadowColor = '#39ff14';
                ctx.fillText('¡VETA MADRE ALCANZADA!', w / 2, h * 0.34);

                ctx.shadowBlur = 0;
                ctx.font = `${esMovil ? 13 : 20}px sans-serif`;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`Profundidad: -${Math.floor(profundidad)} m · Cristales: ${mineralesExtraidos}`, w / 2, h * 0.43);

                ctx.font = `${esMovil ? 12 : 17}px sans-serif`;
                ctx.fillStyle = '#00f0ff';
                const cuentaReinicio = Math.ceil(3 - tiempoFase);
                ctx.fillText(`Nueva excavación en ${cuentaReinicio}...`, w / 2, h * 0.51);
            }

            ctx.restore();

            animacionId = requestAnimationFrame(iniciarBucle);
        }
    </script>
</body>
