<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep-Core Drill - Simulador de Perforadora Subterránea</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            user-select: none;
        }

        /* Botón de Inicio Centrado */
        #btn-inicio {
            padding: 20px 55px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(10, 5, 25, 0.85);
            border: 2px solid #00f0ff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            z-index: 40;
            letter-spacing: 2px;
        }

        #btn-inicio:hover {
            background-color: #00f0ff;
            color: #000000;
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.95);
            transform: scale(1.08);
        }

        /* Controles Flotantes Superiores */
        .controles-sup {
            display: none;
            position: fixed;
            top: 20px;
            right: 25px;
            gap: 12px;
            z-index: 50;
        }

        .btn-sup {
            padding: 10px 20px;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-sup:hover {
            background: #00f0ff;
            color: #000000;
        }

        #btn-salir:hover {
            background: #ff0055;
            border-color: #ff0055;
            color: #ffffff;
        }

        /* Controles Interactivos de Perforadora (Inferior Derecha) */
        .controles-broca {
            display: none;
            position: fixed;
            bottom: 22px;
            right: 30px;
            gap: 14px;
            z-index: 35;
        }

        .btn-mando {
            width: 86px;
            height: 112px;
            border-radius: 14px;
            border: 2px solid #fff;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: transform 0.1s ease, box-shadow 0.15s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
            text-align: center;
        }

        #btn-refrigerar {
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.85), rgba(0, 100, 140, 0.95));
            border-color: #00f0ff;
            color: #000000;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        #btn-refrigerar:active, #btn-refrigerar.activo {
            transform: scale(0.92) translateY(4px);
            background: #00f0ff;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.95);
        }

        #btn-frenar {
            background: linear-gradient(180deg, rgba(255, 0, 85, 0.85), rgba(140, 0, 40, 0.95));
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        #btn-frenar:active, #btn-frenar.activo {
            transform: scale(0.92) translateY(4px);
            background: #ff0055;
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.95);
        }

        #btn-perforar {
            background: linear-gradient(180deg, rgba(57, 255, 20, 0.85), rgba(20, 130, 0, 0.95));
            border-color: #39ff14;
            color: #000000;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
        }

        #btn-perforar:active, #btn-perforar.activo {
            transform: scale(0.92) translateY(4px);
            background: #39ff14;
            box-shadow: 0 0 35px rgba(57, 255, 20, 0.95);
        }

        #canvas-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <audio id="miMusica" src="musica51.mp3" preload="auto" loop></audio>

    <button id="btn-inicio">INICIO</button>

    <div class="controles-sup" id="panel-sup">
        <button class="btn-sup" id="btn-laser">🔦 Láseres: ON</button>
        <button class="btn-sup" id="btn-audio">🔊 Audio: ON</button>
        <button class="btn-sup" id="btn-salir">✖ Salir</button>
    </div>

    <div class="controles-broca" id="controles-broca">
        <button class="btn-mando" id="btn-refrigerar">
            <span>CRIO-FRÍO</span>
            <small>[C / Espacio]</small>
        </button>
        <button class="btn-mando" id="btn-frenar">
            <span>RETENER</span>
            <small>[S / ↓]</small>
        </button>
        <button class="btn-mando" id="btn-perforar">
            <span>PERFORAR</span>
            <small>[W / ↑]</small>
        </button>
    </div>

    <div id="canvas-container">
        <canvas id="drillCanvas"></canvas>
    </div>

    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const panelSup = document.getElementById('panel-sup');
        const controlesBroca = document.getElementById('controles-broca');
        const btnPerforar = document.getElementById('btn-perforar');
        const btnFrenar = document.getElementById('btn-frenar');
        const btnRefrigerar = document.getElementById('btn-refrigerar');
        const btnLaser = document.getElementById('btn-laser');
        const btnAudio = document.getElementById('btn-audio');
        const btnSalir = document.getElementById('btn-salir');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('drillCanvas');
        const ctx = canvas.getContext('2d');
        const audioElement = document.getElementById('miMusica');

        let animacionId = null;
        let activo = false;

        // Estados de la expedición: 'DESCENSO_POZO', 'PERFORANDO', 'NUCLEO_ALCANZADO'
        let faseJuego = 'DESCENSO_POZO';
        let tiempoFase = 0;
        let ultimoFrameTime = 0;

        // Misión contrarreloj de 60 segundos hasta la veta madre
        const DURACION_MISION = 60.0;
        let tiempoRestante = DURACION_MISION;

        // Parámetros físicos de la perforadora
        let velocidadAvance = 0;      // m/s (0 a 35)
        let rpmBroca = 120;           // RPM cabezal de corte (0 a 1200)
        let temperaturaBroca = 280;   // °C (100°C a 1200°C - peligro > 950°C)
        let presionHidraulica = 140;  // BAR (50 a 450 BAR)
        let profundidad = 420;        // Metros bajo superficie
        let mineralesExtraidos = 0;   // Unidades cuánticas recolectadas
        let sobrecalentado = false;

        let laseresActivos = true;
        let rumboLateral = 0;         // Dirección de perforación (-1 a 1)
        let anguloCabezal = 0;        // Rotación visual de la broca frontal

        // Controles presionados
        let perforando = false;
        let frenando = false;
        let refrigerando = false;
        let girandoIzq = false;
        let girandoDer = false;

        // Trazado procedural y partículas
        let semillaMina = {};
        let cristalesMina = [];
        let particulas = [];

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            if (activo) ajustarCanvas();
        });

        // Controles de Teclado
        window.addEventListener('keydown', (e) => {
            if (!activo) return;
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { perforando = true; btnPerforar.classList.add('activo'); }
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { frenando = true; btnFrenar.classList.add('activo'); }
            if (e.key === 'c' || e.key === 'C' || e.key === ' ') { refrigerando = true; btnRefrigerar.classList.add('activo'); }
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') girandoIzq = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') girandoDer = true;
        });

        window.addEventListener('keyup', (e) => {
            if (!activo) return;
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { perforando = false; btnPerforar.classList.remove('activo'); }
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { frenando = false; btnFrenar.classList.remove('activo'); }
            if (e.key === 'c' || e.key === 'C' || e.key === ' ') { refrigerando = false; btnRefrigerar.classList.remove('activo'); }
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') girandoIzq = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') girandoDer = false;
        });

        // Eventos táctiles y ratón para mandos
        const bindMando = (btn, setFlag) => {
            const on = (e) => { e.preventDefault(); e.stopPropagation(); setFlag(true); btn.classList.add('activo'); };
            const off = (e) => { e.preventDefault(); e.stopPropagation(); setFlag(false); btn.classList.remove('activo'); };
            btn.addEventListener('mousedown', on);
            btn.addEventListener('mouseup', off);
            btn.addEventListener('mouseleave', off);
            btn.addEventListener('touchstart', on);
            btn.addEventListener('touchend', off);
        };

        bindMando(btnPerforar, (v) => perforando = v);
        bindMando(btnFrenar, (v) => frenando = v);
        bindMando(btnRefrigerar, (v) => refrigerando = v);

        btnLaser.addEventListener('click', (e) => {
            e.stopPropagation();
            laseresActivos = !laseresActivos;
            btnLaser.textContent = laseresActivos ? "🔦 Láseres: ON" : "💡 Láseres: ECO";
        });

        btnAudio.addEventListener('click', (e) => {
            e.stopPropagation();
            audioElement.muted = !audioElement.muted;
            btnAudio.textContent = audioElement.muted ? "🔇 Audio: OFF" : "🔊 Audio: ON";
        });

        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelSup.style.display = 'flex';
            canvasContainer.style.display = 'block';

            ajustarCanvas();
            generarNuevaExcavacion();
            activo = true;
            ultimoFrameTime = performance.now();

            audioElement.currentTime = 0;
            audioElement.muted = false;
            btnAudio.textContent = "🔊 Audio: ON";
            audioElement.play().catch(() => {});

            iniciarBucle(ultimoFrameTime);
        });

        btnSalir.addEventListener('click', (e) => {
            e.stopPropagation();
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);
            audioElement.pause();

            canvasContainer.style.display = 'none';
            panelSup.style.display = 'none';
            controlesBroca.style.display = 'none';
            btnInicio.style.display = 'block';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function generarNuevaExcavacion() {
            faseJuego = 'DESCENSO_POZO';
            tiempoFase = 0;
            tiempoRestante = DURACION_MISION;

            velocidadAvance = 0;
            rpmBroca = 150;
            temperaturaBroca = 260;
            presionHidraulica = 120;
            profundidad = 400 + Math.floor(Math.random() * 200);
            mineralesExtraidos = 0;
            sobrecalentado = false;
            rumboLateral = 0;
            particulas = [];

            semillaMina = {
                freqX1: 0.002 + Math.random() * 0.002,
                freqX2: 0.0045 + Math.random() * 0.003,
                ampX: 0.8 + Math.random() * 0.6,
                faseX: Math.random() * Math.PI * 2,
                freqY1: 0.0022 + Math.random() * 0.002,
                ampY: 0.7 + Math.random() * 0.5,
                faseY: Math.random() * Math.PI * 2,
                freqDureza: 0.006 + Math.random() * 0.005,
                faseDureza: Math.random() * Math.PI * 2
            };

            // Generar vetas de cristales cuánticos en las paredes del túnel
            const coloresCristal = ['#00f0ff', '#39ff14', '#ff007f', '#ffaa00'];
            cristalesMina = [];
            for (let d = 420; d < 3500; d += 18 + Math.random() * 28) {
                cristalesMina.push({
                    prof: d,
                    angulo: Math.random() * Math.PI * 2,
                    tamano: 0.6 + Math.random() * 1.1,
                    color: coloresCristal[Math.floor(Math.random() * coloresCristal.length)],
                    recolectado: false
                });
            }
        }

        function obtenerDesvioX(p) {
            return (Math.sin(p * semillaMina.freqX1 + semillaMina.faseX) * 0.65 +
                    Math.cos(p * semillaMina.freqX2) * 0.35) * semillaMina.ampX;
        }

        function obtenerDesvioY(p) {
            return Math.sin(p * semillaMina.freqY1 + semillaMina.faseY) * semillaMina.ampY;
        }

        // Devuelve dureza de la roca entre 0.2 (sedimento blando) y 1.0 (granito cuántico ultra-duro)
        function obtenerDurezaRoca(p) {
            return 0.55 + Math.sin(p * semillaMina.freqDureza + semillaMina.faseDureza) * 0.45;
        }

        function emitirChispasRoca(cx, cy, cantidad, colorBase) {
            for (let i = 0; i < cantidad; i++) {
                const ang = Math.random() * Math.PI * 2;
                const vel = 120 + Math.random() * 380;
                particulas.push({
                    x: cx + (Math.random() - 0.5) * 90,
                    y: cy + (Math.random() - 0.5) * 90,
                    vx: Math.cos(ang) * vel,
                    vy: Math.sin(ang) * vel,
                    vida: 0.5 + Math.random() * 0.5,
                    maxVida: 1.0,
                    color: colorBase,
                    tam: 2 + Math.random() * 3.5
                });
            }
        }

        function dibujarIndicadorCircular(ctx, cx, cy, radio, valor, minVal, maxVal, titulo, unidad, colorNormal, umbralAlerta) {
            ctx.save();
            ctx.fillStyle = '#060a12';
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(cx, cy, radio, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            const angInicio = Math.PI * 0.75;
            const angFin = Math.PI * 2.25;
            const rango = angFin - angInicio;

            ctx.lineWidth = 6;
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.arc(cx, cy, radio - 9, angInicio, angFin);
            ctx.stroke();

            const frac = Math.min(1, Math.max(0, (valor - minVal) / (maxVal - minVal)));
            const enAlerta = umbralAlerta !== null && valor >= umbralAlerta;
            const colorActivo = enAlerta ? '#ff0055' : colorNormal;

            ctx.strokeStyle = colorActivo;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colorActivo;
            ctx.beginPath();
            ctx.arc(cx, cy, radio - 9, angInicio, angInicio + frac * rango);
            ctx.stroke();

            // Aguja
            const angAguja = angInicio + frac * rango;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angAguja) * (radio - 13), cy + Math.sin(angAguja) * (radio - 13));
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = colorActivo;
            ctx.font = 'bold 14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(Math.round(valor), cx, cy + radio * 0.42);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '9px sans-serif';
            ctx.fillText(`${titulo} ${unidad}`, cx, cy + radio * 0.72);
            ctx.restore();
        }

        function dibujarCristal3D(ctx, x, y, escala, angulo, color) {
            const h = 38 * escala;
            const w = 14 * escala;
            if (h < 3) return;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angulo + Math.PI / 2);

            ctx.fillStyle = color;
            ctx.shadowBlur = 16 * escala;
            ctx.shadowColor = color;

            // Prisma cristalino principal
            ctx.beginPath();
            ctx.moveTo(0, -h);
            ctx.lineTo(w, -h * 0.25);
            ctx.lineTo(w * 0.6, 0);
            ctx.lineTo(-w * 0.6, 0);
            ctx.lineTo(-w, -h * 0.25);
            ctx.closePath();
            ctx.fill();

            // Cristal secundario inclinado
            ctx.rotate(0.45);
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.7);
            ctx.lineTo(w * 0.7, -h * 0.2);
            ctx.lineTo(0, 0);
            ctx.lineTo(-w * 0.7, -h * 0.2);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function iniciarBucle(timestamp) {
            if (!activo) return;

            const dt = Math.min(0.05, (timestamp - ultimoFrameTime) / 1000);
            ultimoFrameTime = timestamp;
            tiempoFase += dt;

            const w = canvas.width;
            const h = canvas.height;

            // =========================================================================
            // FASE 1: INMERSIÓN EN EL POZO CUÁNTICO (3 SEGUNDOS)
            // =========================================================================
            if (faseJuego === 'DESCENSO_POZO') {
                controlesBroca.style.display = 'none';
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, w, h);

                const prog = Math.min(1, tiempoFase / 3.0);
                const cx = w / 2;
                const cy = h / 2;

                // Anillos concéntricos de descenso al pozo de perforación
                for (let k = 8; k >= 1; k--) {
                    const radio = (k * 55) * (0.4 + Math.pow(prog, 1.8) * 1.9);
                    ctx.strokeStyle = k % 2 === 0 ? 'rgba(0, 240, 255, 0.35)' : 'rgba(255, 0, 127, 0.25)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radio, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Silueta iluminada de la boca del túnel subterráneo
                const rBoca = 90 + Math.pow(prog, 2.3) * 320;
                ctx.fillStyle = '#050811';
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 5;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00f0ff';
                ctx.beginPath();
                ctx.arc(cx, cy, rBoca, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#00f0ff';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                const segs = Math.ceil(3 - tiempoFase);
                ctx.fillText(`ACOPLANDO CABINA DE PERFORACIÓN EN ${segs}...`, cx, h - 65);

                if (tiempoFase >= 3.0) {
                    faseJuego = 'PERFORANDO';
                    tiempoFase = 0;
                    velocidadAvance = 14;
                    controlesBroca.style.display = 'flex';
                }

                animacionId = requestAnimationFrame(iniciarBucle);
                return;
            }

            // =========================================================================
            // FASE 2: PERFORACIÓN ACTIVA (60 SEGUNDOS)
            // =========================================================================
            const durezaActual = obtenerDurezaRoca(profundidad);

            if (faseJuego === 'PERFORANDO') {
                tiempoRestante -= dt;
                if (tiempoRestante <= 0) {
                    tiempoRestante = 0;
                    faseJuego = 'NUCLEO_ALCANZADO';
                    tiempoFase = 0;
                    controlesBroca.style.display = 'none';
                }

                // Control de sobrecalentamiento del núcleo de la broca
                if (temperaturaBroca >= 1050) {
                    sobrecalentado = true;
                } else if (temperaturaBroca <= 520) {
                    sobrecalentado = false;
                }

                // Físicas de rotación, avance y temperatura
                if (perforando && !sobrecalentado) {
                    rpmBroca += (1150 - rpmBroca) * 3.5 * dt;
                    const empujeEfectivo = (28 - durezaActual * 14);
                    velocidadAvance += (empujeEfectivo - velocidadAvance) * 2.5 * dt;
                    temperaturaBroca += (85 + durezaActual * 135) * dt;
                    presionHidraulica += ((260 + durezaActual * 170) - presionHidraulica) * 4 * dt;
                } else if (frenando) {
                    rpmBroca += (120 - rpmBroca) * 4 * dt;
                    velocidadAvance = Math.max(0, velocidadAvance - 22 * dt);
                    temperaturaBroca = Math.max(120, temperaturaBroca - 65 * dt);
                    presionHidraulica += (90 - presionHidraulica) * 4 * dt;
                } else {
                    // Avance en ralentí
                    const velRalenti = sobrecalentado ? 2 : 11;
                    rpmBroca += ((sobrecalentado ? 80 : 480) - rpmBroca) * 2.5 * dt;
                    velocidadAvance += (velRalenti - velocidadAvance) * 2 * dt;
                    temperaturaBroca = Math.max(150, temperaturaBroca - 35 * dt);
                    presionHidraulica += (150 - presionHidraulica) * 3 * dt;
                }

                // Sistema criogénico de enfriamiento rápido
                if (refrigerando) {
                    temperaturaBroca = Math.max(100, temperaturaBroca - 260 * dt);
                }

                temperaturaBroca = Math.min(1150, temperaturaBroca);
                profundidad += velocidadAvance * dt * 1.4;
                anguloCabezal += (rpmBroca / 60) * Math.PI * 2 * dt;

                // Dirección lateral del cabezal
                if (girandoIzq) rumboLateral -= 0.9 * dt;
                if (girandoDer) rumboLateral += 0.9 * dt;
                rumboLateral = Math.max(-0.85, Math.min(0.85, rumboLateral));

                // Emisión de chispas y esquirlas al perforar roca dura
                if (velocidadAvance > 4 && Math.random() < 0.45 + durezaActual * 0.45) {
                    const colorChispa = temperaturaBroca > 800 ? '#ff3366' : (durezaActual > 0.7 ? '#ffaa00' : '#00f0ff');
                    emitirChispasRoca(w / 2, h * 0.48, perforando ? 4 : 2, colorChispa);
                }
            } else if (faseJuego === 'NUCLEO_ALCANZADO') {
                velocidadAvance = Math.max(0, velocidadAvance - 15 * dt);
                rpmBroca = Math.max(0, rpmBroca - 350 * dt);
                anguloCabezal += (rpmBroca / 60) * Math.PI * 2 * dt;

                if (tiempoFase >= 3.0) {
                    generarNuevaExcavacion();
                    animacionId = requestAnimationFrame(iniciarBucle);
                    return;
                }
            }

            // =========================================================================
            // RENDERIZADO 3D DEL CONDUCTO SUBTERRÁNEO Y CRISTALES CUÁNTICOS
            // =========================================================================
            ctx.fillStyle = '#020306';
            ctx.fillRect(0, 0, w, h);

            const numAnillos = 42;
            const pasoProf = 4.5;
            const profBase = Math.floor(profundidad / pasoProf) * pasoProf;
            const subOffset = (profundidad - profBase) / pasoProf;

            const camX = obtenerDesvioX(profundidad);
            const camY = obtenerDesvioY(profundidad);

            let anillos = [];
            for (let i = numAnillos; i >= 1; i--) {
                const zIdx = i - subOffset;
                const profSeg = profBase + i * pasoProf;
                const escala = 1 / (1 + zIdx * 0.17);

                const dx = (obtenerDesvioX(profSeg) - camX) * Math.pow(zIdx, 1.5) * 11 - (rumboLateral * 240 * escala);
                const dy = (obtenerDesvioY(profSeg) - camY) * Math.pow(zIdx, 1.45) * 9;

                const cx = w / 2 + dx;
                const cy = h * 0.48 + dy;
                const radioTunel = Math.max(w, h) * 0.72 * escala;
                const durezaSeg = obtenerDurezaRoca(profSeg);

                const alcanceLaser = laseresActivos ? 34 : 18;
                const luzFoco = Math.max(0, 1 - zIdx / alcanceLaser);

                anillos.push({
                    i, zIdx, profSeg, escala, cx, cy, radioTunel, durezaSeg, luzFoco
                });
            }

            // Dibujar paredes poligonales rocosas del túnel de lejos hacia la cabina
            const ladosPoligono = 14;
            for (let a = 0; a < anillos.length - 1; a++) {
                const lej = anillos[a];
                const cer = anillos[a + 1];

                // Tono de la roca según dureza (granito azulado/violáceo vs basalto oscuro)
                const luz = 0.08 + cer.luzFoco * 0.85;
                const rCol = Math.floor((22 + cer.durezaSeg * 38) * luz);
                const gCol = Math.floor((18 + (1 - cer.durezaSeg) * 32) * luz);
                const bCol = Math.floor((42 + cer.durezaSeg * 55) * luz);

                for (let l = 0; l < ladosPoligono; l++) {
                    const ang1 = (l / ladosPoligono) * Math.PI * 2;
                    const ang2 = ((l + 1) / ladosPoligono) * Math.PI * 2;

                    // Rugosidad rocosa determinista por segmento
                    const rug1Lej = 0.92 + Math.sin(lej.profSeg * 0.2 + l * 1.7) * 0.08;
                    const rug2Lej = 0.92 + Math.sin(lej.profSeg * 0.2 + (l + 1) * 1.7) * 0.08;
                    const rug1Cer = 0.92 + Math.sin(cer.profSeg * 0.2 + l * 1.7) * 0.08;
                    const rug2Cer = 0.92 + Math.sin(cer.profSeg * 0.2 + (l + 1) * 1.7) * 0.08;

                    const x1L = lej.cx + Math.cos(ang1) * lej.radioTunel * rug1Lej;
                    const y1L = lej.cy + Math.sin(ang1) * lej.radioTunel * rug1Lej;
                    const x2L = lej.cx + Math.cos(ang2) * lej.radioTunel * rug2Lej;
                    const y2L = lej.cy + Math.sin(ang2) * lej.radioTunel * rug2Lej;

                    const x1C = cer.cx + Math.cos(ang1) * cer.radioTunel * rug1Cer;
                    const y1C = cer.cy + Math.sin(ang1) * cer.radioTunel * rug1Cer;
                    const x2C = cer.cx + Math.cos(ang2) * cer.radioTunel * rug2Cer;
                    const y2C = cer.cy + Math.sin(ang2) * cer.radioTunel * rug2Cer;

                    // Sombreado facetado para volumen 3D de roca
                    const sombraFaceta = 0.8 + Math.sin(l * 2.1 + lej.profSeg * 0.1) * 0.2;
                    ctx.fillStyle = `rgb(${Math.floor(rCol * sombraFaceta)}, ${Math.floor(gCol * sombraFaceta)}, ${Math.floor(bCol * sombraFaceta)})`;
                    ctx.beginPath();
                    ctx.moveTo(x1L, y1L);
                    ctx.lineTo(x2L, y2L);
                    ctx.lineTo(x2C, y2C);
                    ctx.lineTo(x1C, y1C);
                    ctx.closePath();
                    ctx.fill();

                    // Aristas minerales luminosas en vetas duras
                    if (cer.durezaSeg > 0.72 && l % 3 === 0) {
                        ctx.strokeStyle = `rgba(0, 240, 255, ${cer.luzFoco * 0.35})`;
                        ctx.lineWidth = Math.max(1, 2 * cer.escala);
                        ctx.beginPath();
                        ctx.moveTo(x1L, y1L);
                        ctx.lineTo(x1C, y1C);
                        ctx.stroke();
                    }
                }

                // Cristales cuánticos incrustados en las paredes
                for (let cristal of cristalesMina) {
                    if (!cristal.recolectado && Math.abs(cristal.prof - cer.profSeg) < pasoProf * 0.5) {
                        const cxCris = cer.cx + Math.cos(cristal.angulo) * (cer.radioTunel * 0.92);
                        const cyCris = cer.cy + Math.sin(cristal.angulo) * (cer.radioTunel * 0.92);
                        dibujarCristal3D(ctx, cxCris, cyCris, cer.escala * cristal.tamano * 1.5, cristal.angulo, cristal.color);

                        // Recolectar mineral al pasar cerca
                        if (cer.zIdx < 2.2) {
                            cristal.recolectado = true;
                            mineralesExtraidos += Math.floor(15 + cristal.tamano * 20);
                            emitirChispasRoca(cxCris, cyCris, 10, cristal.color);
                        }
                    }
                }
            }

            // =========================================================================
            // CABEZAL DE CORTE ROTATORIO Y HACES LÁSER DE EXCAVACIÓN
            // =========================================================================
            const fondoTunel = anillos[0];
            const cabezalX = fondoTunel.cx;
            const cabezalY = fondoTunel.cy;

            // Haces láser proyectados desde la cabina hacia el frente de excavación
            if (laseresActivos) {
                ctx.save();
                const origenesLaser = [
                    { x: w * 0.14, y: h * 0.25, color: 'rgba(0, 240, 255, 0.22)' },
                    { x: w * 0.86, y: h * 0.25, color: 'rgba(0, 240, 255, 0.22)' },
                    { x: w * 0.22, y: h * 0.72, color: 'rgba(255, 0, 127, 0.20)' },
                    { x: w * 0.78, y: h * 0.72, color: 'rgba(255, 0, 127, 0.20)' }
                ];

                for (let lsr of origenesLaser) {
                    const gradL = ctx.createLinearGradient(lsr.x, lsr.y, cabezalX, cabezalY);
                    gradL.addColorStop(0, lsr.color);
                    gradL.addColorStop(1, 'rgba(0, 240, 255, 0.02)');

                    ctx.strokeStyle = gradL;
                    ctx.lineWidth = perforando ? 14 : 7;
                    ctx.beginPath();
                    ctx.moveTo(lsr.x, lsr.y);
                    ctx.lineTo(cabezalX + Math.cos(anguloCabezal) * 28, cabezalY + Math.sin(anguloCabezal) * 28);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Cabezal giratorio de brocas de diamante en el frente de perforación
            ctx.save();
            ctx.translate(cabezalX, cabezalY);
            ctx.rotate(anguloCabezal);

            const rBroca = 46;
            const colorIncandescencia = temperaturaBroca > 850 ? '#ff0055' : (temperaturaBroca > 600 ? '#ffaa00' : '#00f0ff');

            ctx.strokeStyle = colorIncandescencia;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 18;
            ctx.shadowColor = colorIncandescencia;

            for (let b = 0; b < 6; b++) {
                const angB = (b / 6) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angB) * rBroca, Math.sin(angB) * rBroca);
                ctx.stroke();

                // Dientes de corte de plasma
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(Math.cos(angB) * (rBroca * 0.72), Math.sin(angB) * (rBroca * 0.72), 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // Partículas de chispas y esquirlas volando hacia la cabina
            ctx.save();
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vida -= dt * 1.4;

                if (p.vida <= 0) {
                    particulas.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = Math.max(0, p.vida);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.tam, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // =========================================================================
            // INTERIOR DE LA CABINA BLINDADA DE LA PERFORADORA
            // =========================================================================
            ctx.save();

            // Vibración mecánica proporcional a RPM y dureza de la roca
            const intensidadVib = (rpmBroca / 1200) * (0.8 + durezaActual * 2.6);
            const vibX = velocidadAvance > 0.5 ? (Math.random() - 0.5) * intensidadVib * 2 : 0;
            const vibY = velocidadAvance > 0.5 ? (Math.random() - 0.5) * intensidadVib * 2 : 0;

            ctx.translate(vibX, vibY);

            // Estructura blindada del marco del parabrisas
            ctx.fillStyle = '#060911';
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3;

            // Marco exterior hexagonal de cabina
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(w, 0);
            ctx.lineTo(w, h);
            ctx.lineTo(w - 65, h);
            ctx.lineTo(w - 35, 80);
            ctx.lineTo(w * 0.72, 35);
            ctx.lineTo(w * 0.28, 35);
            ctx.lineTo(35, 80);
            ctx.lineTo(65, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fill();

            // Barras de refuerzo estructural en las esquinas del cristal
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(35, 80);
            ctx.lineTo(w * 0.28, 35);
            ctx.lineTo(w * 0.72, 35);
            ctx.lineTo(w - 35, 80);
            ctx.stroke();

            // Consola de instrumentos inferior
            const altoConsola = 165;
            const topConsola = h - altoConsola;

            const gradConsola = ctx.createLinearGradient(0, topConsola, 0, h);
            gradConsola.addColorStop(0, '#101827');
            gradConsola.addColorStop(1, '#05080f');
            ctx.fillStyle = gradConsola;
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(0, topConsola + 25);
            ctx.lineTo(w * 0.14, topConsola);
            ctx.lineTo(w * 0.64, topConsola);
            ctx.lineTo(w * 0.78, topConsola + 30);
            ctx.lineTo(w, topConsola + 30);
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Tres relojes principales de ingeniería:
            // 1. Temperatura de Broca (°C)
            // 2. Presión Hidráulica (BAR)
            // 3. Velocidad de Perforación (m/s)
            const baseRelojesX = w * 0.36;
            const centroRelojesY = topConsola + 84;

            dibujarIndicadorCircular(ctx, baseRelojesX - 145, centroRelojesY, 58, temperaturaBroca, 100, 1150, 'TEMP BROCA', '°C', '#ffaa00', 850);
            dibujarIndicadorCircular(ctx, baseRelojesX, centroRelojesY, 58, presionHidraulica, 50, 450, 'PRESIÓN', 'BAR', '#00f0ff', 380);
            dibujarIndicadorCircular(ctx, baseRelojesX + 145, centroRelojesY, 58, velocidadAvance, 0, 35, 'AVANCE', 'M/S', '#39ff14', null);

            // Alerta visual de sobrecalentamiento en cabina
            if (sobrecalentado) {
                ctx.fillStyle = 'rgba(255, 0, 85, 0.22)';
                ctx.fillRect(0, 0, w, h);

                ctx.textAlign = 'center';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0055';
                ctx.fillText('⚠ NÚCLEO SOBRECALENTADO - USA CRIO-FRÍO [C] ⚠', w / 2, h * 0.25);
                ctx.shadowBlur = 0;
            }

            // Panel HUD superior izquierdo (Telemetría de Profundidad y Minerales)
            ctx.fillStyle = 'rgba(5, 10, 20, 0.78)';
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(25, 20, 295, 104, 12);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillStyle = '#00f0ff';
            ctx.fillText(`TIEMPO A VETA MADRE: ${tiempoRestante.toFixed(1)} s`, 40, 44);

            ctx.font = '13px sans-serif';
            ctx.fillStyle = '#39ff14';
            ctx.fillText(`PROFUNDIDAD: -${Math.floor(profundidad)} METROS`, 40, 66);

            ctx.fillStyle = '#ff007f';
            ctx.fillText(`CRISTALES CUÁNTICOS: ${mineralesExtraidos} UDS`, 40, 88);

            const nivelDurezaTxt = durezaActual > 0.75 ? 'GRANITO ULTRA-DURO' : (durezaActual > 0.45 ? 'ROCA BASÁLTICA' : 'SEDIMENTO BLANDO');
            ctx.fillStyle = '#ffaa00';
            ctx.fillText(`ESTRATO: ${nivelDurezaTxt}`, 40, 110);

            // =========================================================================
            // PANTALLA DE VETA MADRE ALCANZADA (60 SEGUNDOS)
            // =========================================================================
            if (faseJuego === 'NUCLEO_ALCANZADO') {
                ctx.fillStyle = 'rgba(0, 5, 15, 0.78)';
                ctx.fillRect(0, 0, w, h);

                ctx.textAlign = 'center';
                ctx.font = 'bold 42px sans-serif';
                ctx.fillStyle = '#39ff14';
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#39ff14';
                ctx.fillText('¡VETA MADRE ALCANZADA!', w / 2, h * 0.36);

                ctx.shadowBlur = 0;
                ctx.font = '22px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`Profundidad final: -${Math.floor(profundidad)} m | Cristales extraídos: ${mineralesExtraidos}`, w / 2, h * 0.44);

                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#00f0ff';
                const cuentaReinicio = Math.ceil(3 - tiempoFase);
                ctx.fillText(`Iniciando nueva excavación en ${cuentaReinicio}...`, w / 2, h * 0.52);
            }

            ctx.restore();

            animacionId = requestAnimationFrame(iniciarBucle);
        }
    </script>
</body>
</html>
